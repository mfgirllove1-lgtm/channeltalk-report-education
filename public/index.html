<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>쏘카 WFM 매니저 면접 대비 · SQL 연습장</title>
<style>
  :root {
    --bg: #0f1420;
    --panel: #161d2e;
    --panel-2: #1d2740;
    --border: #2a3455;
    --text: #e6e9f2;
    --text-dim: #9aa4c0;
    --accent: #4f8cff;
    --accent-2: #6ee7b7;
    --danger: #ff6b6b;
    --warn: #ffd166;
    --mono: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Segoe UI", Pretendard, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    flex-direction: column;
    height: 100vh;
    overflow: hidden;
  }
  header {
    padding: 14px 20px;
    background: linear-gradient(90deg, #14213d, #1a2a52);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
  }
  header h1 {
    font-size: 16px;
    margin: 0;
    font-weight: 700;
  }
  header h1 span { color: var(--accent-2); }
  header .sub { font-size: 12px; color: var(--text-dim); margin-top: 2px; }
  nav.tabs {
    display: flex;
    gap: 4px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    padding: 0 16px;
    flex-shrink: 0;
  }
  nav.tabs button {
    background: transparent;
    border: none;
    color: var(--text-dim);
    padding: 10px 16px;
    font-size: 13px;
    cursor: pointer;
    border-bottom: 2px solid transparent;
  }
  nav.tabs button.active {
    color: var(--text);
    border-bottom-color: var(--accent);
    font-weight: 600;
  }
  main { flex: 1; overflow: hidden; display: flex; }
  .view { flex: 1; overflow: hidden; display: none; }
  .view.active { display: flex; }

  /* ---- SQL practice view ---- */
  #view-practice { }
  .sidebar {
    width: 300px;
    background: var(--panel);
    border-right: 1px solid var(--border);
    overflow-y: auto;
    flex-shrink: 0;
    padding: 8px 0;
  }
  .cat-title {
    padding: 10px 14px 4px;
    font-size: 11px;
    color: var(--accent-2);
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }
  .q-item {
    padding: 8px 14px;
    cursor: pointer;
    font-size: 13px;
    border-left: 3px solid transparent;
    display: flex;
    justify-content: space-between;
    gap: 6px;
  }
  .q-item:hover { background: var(--panel-2); }
  .q-item.active { background: var(--panel-2); border-left-color: var(--accent); }
  .q-item .lvl {
    font-size: 10px;
    padding: 1px 6px;
    border-radius: 8px;
    height: fit-content;
    white-space: nowrap;
  }
  .lvl.입문 { background: #16273a; color: #7dd3fc; }
  .lvl.쉬움 { background: #16342a; color: var(--accent-2); }
  .lvl.중간 { background: #3a2f14; color: var(--warn); }
  .lvl.어려움 { background: #3a1a1a; color: var(--danger); }

  .content {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .prompt-box {
    padding: 14px 20px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .prompt-box h2 { margin: 0 0 6px; font-size: 15px; }
  .prompt-box p { margin: 0; font-size: 13px; color: var(--text-dim); line-height: 1.6; }
  .toggle-row { margin-top: 10px; display: flex; gap: 8px; }
  .toggle-row button {
    background: var(--panel-2);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 5px 10px;
    border-radius: 6px;
    font-size: 12px;
    cursor: pointer;
  }
  .toggle-row button:hover { border-color: var(--accent); }
  .reveal-box {
    display: none;
    margin-top: 10px;
    background: #0c1220;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 10px 12px;
    font-size: 12.5px;
    color: var(--text-dim);
  }
  .reveal-box.show { display: block; }
  .reveal-box pre { margin: 6px 0 0; white-space: pre-wrap; font-family: var(--mono); color: var(--accent-2); }

  .editor-area { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
  #sql-editor {
    flex: 0 0 140px;
    background: #0c1220;
    color: #e6e9f2;
    font-family: var(--mono);
    font-size: 13px;
    border: none;
    border-bottom: 1px solid var(--border);
    padding: 12px 20px;
    resize: vertical;
    outline: none;
    line-height: 1.5;
  }
  .run-row {
    padding: 8px 20px;
    display: flex;
    align-items: center;
    gap: 10px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .run-row button {
    background: var(--accent);
    color: white;
    border: none;
    padding: 7px 16px;
    border-radius: 6px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
  }
  .run-row button:hover { background: #3f76e0; }
  .run-row .status { font-size: 12px; color: var(--text-dim); }
  .result-area { flex: 1; overflow: auto; padding: 12px 20px; }
  table.result { border-collapse: collapse; font-size: 12.5px; font-family: var(--mono); width: max-content; }
  table.result th {
    background: var(--panel-2);
    color: var(--accent-2);
    text-align: left;
    padding: 6px 10px;
    position: sticky; top: 0;
    border-bottom: 1px solid var(--border);
  }
  table.result td { padding: 5px 10px; border-bottom: 1px solid #1c2438; white-space: nowrap; }
  table.result tr:hover td { background: #131a2c; }
  .error-msg { color: var(--danger); font-family: var(--mono); font-size: 13px; white-space: pre-wrap; }

  /* ---- schema view ---- */
  #view-schema { overflow-y: auto; padding: 20px 24px; }
  #view-schema.active { display: block; }
  .schema-table { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; margin-bottom: 16px; overflow: hidden; }
  .schema-table h3 { margin: 0; padding: 10px 14px; background: var(--panel-2); font-size: 14px; color: var(--accent-2); }
  .schema-table table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  .schema-table td { padding: 6px 14px; border-top: 1px solid var(--border); }
  .schema-table td.col-name { font-family: var(--mono); color: var(--accent); width: 220px; }
  .schema-table td.col-desc { color: var(--text-dim); }

  /* ---- notes view ---- */
  #view-notes { overflow-y: auto; padding: 24px; max-width: 900px; margin: 0 auto; }
  #view-notes.active { display: block; }
  #view-notes h2 { color: var(--accent-2); font-size: 17px; margin-top: 28px; border-bottom: 1px solid var(--border); padding-bottom: 6px; }
  #view-notes h2:first-child { margin-top: 0; }
  #view-notes h3 { font-size: 14px; color: var(--text); margin-top: 18px; }
  #view-notes p, #view-notes li { font-size: 13.5px; line-height: 1.75; color: #d3d8e8; }
  #view-notes code { background: #0c1220; padding: 1px 6px; border-radius: 4px; font-family: var(--mono); color: var(--accent-2); font-size: 12.5px; }
  #view-notes ul { padding-left: 20px; }
  .formula-box {
    background: var(--panel);
    border: 1px solid var(--border);
    border-left: 3px solid var(--accent);
    padding: 10px 14px;
    border-radius: 6px;
    margin: 10px 0;
    font-family: var(--mono);
    font-size: 13px;
    color: var(--accent-2);
  }
  .qa-item {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px 14px;
    margin-bottom: 10px;
  }
  .qa-item .q { font-weight: 600; font-size: 13.5px; margin-bottom: 6px; }
  .qa-item .a { font-size: 13px; color: var(--text-dim); line-height: 1.65; }
</style>
</head>
<body>

<header>
  <div>
    <h1>쏘카 WFM 매니저 면접 대비 <span>· SQL 연습장</span></h1>
    <div class="sub">Channeltalk류 CS 인입 데이터를 흉내낸 가상 SQLite DB로 실전처럼 연습하세요.</div>
  </div>
  <div class="sub" id="db-status">DB 로딩 중...</div>
</header>

<nav class="tabs">
  <button class="tab-btn active" data-view="practice">SQL 연습문제</button>
  <button class="tab-btn" data-view="schema">데이터 스키마</button>
  <button class="tab-btn" data-view="notes">WFM 개념 &amp; 예상질문</button>
</nav>

<main>
  <section id="view-practice" class="view active">
    <div class="sidebar" id="sidebar"></div>
    <div class="content">
      <div class="prompt-box">
        <h2 id="q-title">자유 연습 모드</h2>
        <p id="q-prompt">왼쪽 목록에서 문제를 선택하거나, 아래 에디터에 직접 SQL을 작성해 연습하세요. 예시: <code>SELECT * FROM agents LIMIT 10;</code></p>
        <div class="toggle-row" id="toggle-row" style="display:none;">
          <button id="btn-hint">💡 힌트 보기</button>
          <button id="btn-solution">✅ 모범답안 보기</button>
          <button id="btn-load-solution">모범답안을 에디터에 채우기</button>
        </div>
        <div class="reveal-box" id="hint-box"></div>
        <div class="reveal-box" id="solution-box"><pre id="solution-code"></pre></div>
      </div>
      <div class="editor-area">
        <textarea id="sql-editor" spellcheck="false">SELECT * FROM agents LIMIT 10;</textarea>
        <div class="run-row">
          <button id="btn-run">▶ 실행 (Ctrl/Cmd+Enter)</button>
          <span class="status" id="run-status"></span>
        </div>
        <div class="result-area" id="result-area"></div>
      </div>
    </div>
  </section>

  <section id="view-schema" class="view"></section>

  <section id="view-notes" class="view"></section>
</main>

<script src="vendor/sql-wasm.js"></script>
<script src="questions.js"></script>
<script src="notes.js"></script>
<script src="app.js"></script>
</body>
</html>
